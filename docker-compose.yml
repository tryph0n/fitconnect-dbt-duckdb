services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbt-pipeline:
    build: .
    env_file: .env
    volumes:
      - dbt-data:/app/data
      - dbt-target:/app/target
    command: >
      sh -c "uv run python scripts/load_raw_data.py &&
             uv run dbt build --profiles-dir . &&
             uv run dbt docs generate --profiles-dir ."
    depends_on:
      postgres:
        condition: service_healthy

  dbt-docs:
    build: .
    env_file: .env
    ports:
      - "${DOCS_PORT:-8080}:${DOCS_PORT:-8080}"
    volumes:
      - dbt-data:/app/data
      - dbt-target:/app/target
    command: >
      sh -c "uv run dbt docs serve --profiles-dir . --port ${DOCS_PORT:-8080} --host 0.0.0.0 --no-browser"
    depends_on:
      dbt-pipeline:
        condition: service_completed_successfully

  analytics:
    build: .
    env_file: .env
    volumes:
      - dbt-data:/app/data
    command: uv run python scripts/run_analytics.py
    depends_on:
      dbt-pipeline:
        condition: service_completed_successfully
    profiles:
      - analytics

volumes:
  pg-data:
  dbt-data:
  dbt-target:
